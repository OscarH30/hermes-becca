name: becca
version: 1.2.1
description: "Cold outreach SDR — finds prospects in Apollo, writes human-sounding cold email, keeps your CRM current, works the inbox, and books calls. Approve-first by default."
hermes_requires: ">=0.20.0"
author: "Vindex Consulting"
license: "MIT"

# What the distribution owns. Everything else in the profile — brain/, memories,
# sessions, .env, auth.json, databases — belongs to the installer and is never
# touched by `hermes profile update`.
#
# Note what is deliberately ABSENT from this list: mcp.json and the mcp_servers
# block in config.yaml. Those hold the tools onboarding wired to this profile,
# and an update must never be able to unwire a configured agent. Skills, SOUL,
# and cron improve; access stays exactly as the owner granted it.
distribution_owned:
  - SOUL.md
  - config.yaml
  - skills/
  - cron/
  - scripts/
  - README.md
  - .env.template
  - distribution.yaml


# NOTHING HERE IS REQUIRED TO INSTALL OR START.
#
# Becca arrives with no tool access at all. Her onboarding skill connects what
# she needs and wires it to this profile — Composio (recommended), your own API
# keys, or an MCP server you already run. These variables only apply if you pick
# the direct-key route, and onboarding will tell you which ones it needs.
env_requires:
  - name: COMPOSIO_API_KEY
    description: "Composio API key — the recommended path for Apollo, Gmail, HubSpot, and calendar. Get one free at composio.dev. Onboarding walks you through it."
    required: false
    default: ""
  - name: APOLLO_API_KEY
    description: "Apollo.io API key — only if you are NOT using Composio for Apollo. Requires an Apollo plan that includes API access."
    required: false
    default: ""
  - name: AGENTMAIL_API_KEY
    description: "AgentMail API key — fastest way to give Becca her own sending inbox. Alternative to connecting Gmail/Outlook via Composio."
    required: false
    default: ""
  - name: HUBSPOT_ACCESS_TOKEN
    description: "HubSpot private-app token — only if you are NOT using Composio for HubSpot."
    required: false
    default: ""
  - name: GHL_API_KEY
    description: "GoHighLevel API key — only if you are NOT using Composio for GoHighLevel."
    required: false
    default: ""
  - name: GHL_LOCATION_ID
    description: "GoHighLevel location (sub-account) ID that Becca should write leads into."
    required: false
    default: ""
  - name: BECCA_BOOKING_LINK
    description: "Your scheduling link (Calendly, Cal.com, HubSpot Meetings). Becca drops this into emails so no calendar API is required."
    required: false
    default: ""
