name: becca
# 1.5.0: brain-first onboarding (pull from your company brain or build one by interview); any CRM or a CSV or Google Sheet; one new campaign each weekday, approved by email per campaign before anything is sent; Interested replies pushed to your CRM.
# 1.4.0: set up from one line on any agent; onboarding interviews on the last ten customers; adds treg.to.
version: 1.5.0
description: "Cold outreach SDR. Finds prospects with Apollo and treg.to, writes human-sounding cold email, builds one campaign a day and emails it to you for approval, works the inbox, and pushes interested replies to your CRM. Nothing sends until you approve that campaign by email."
hermes_requires: ">=0.20.0"
author: "Vindex Consulting"
license: "MIT"

# What the distribution owns. Everything else in the profile: brain/, memories,
# sessions, .env, auth.json, databases: belongs to the installer and is never
# touched by `hermes profile update`.
#
# Note what is deliberately ABSENT from this list: mcp.json and the mcp_servers
# block in config.yaml. Those hold the tools onboarding wired to this profile,
# and an update must never be able to unwire a configured agent. Skills, SOUL,
# and cron improve; access stays exactly as the owner granted it.
distribution_owned:
  - SOUL.md
  - config.yaml
  - skills/
  - cron/
  - scripts/
  - README.md
  - AGENT-SETUP.md
  - .env.template
  - distribution.yaml


# NOTHING HERE IS REQUIRED TO INSTALL OR START.
#
# Becca arrives with no tool access at all. Her onboarding skill connects what
# she needs and wires it to this profile: Composio (recommended), the tool's own
# sign-in, or an MCP server you already run. These variables only apply if you
# pick the direct-key route, and onboarding will tell you which ones it needs.
# Never paste a key into the chat. Keys go in this profile's .env.
env_requires:
  - name: COMPOSIO_API_KEY
    description: "Composio API key. The recommended path for Apollo, Instantly, your CRM, Gmail, and calendar. Get one free at composio.dev. Onboarding walks you through it."
    required: false
    default: ""
  - name: APOLLO_API_KEY
    description: "Apollo.io API key: only if you are NOT using Composio for Apollo. Requires an Apollo plan that includes API access."
    required: false
    default: ""
  - name: TREG_API_KEY
    description: "treg.to key. Only if your platform needs a key; prefer the platform's secure connector. The usual setup is to give your agent 'set up treg - https://treg.to/llms.txt' and approve the connection in treg.to. Pay-per-call research tools (verify emails, enrich companies, local business data), price shown before each call."
    required: false
    default: ""
  - name: INSTANTLY_API_KEY
    description: "Instantly API key: the recommended sending path. Becca loads each approved campaign and Instantly sends them in your name from your warmed lookalike domains. Only needed if you are NOT connecting Instantly through Composio."
    required: false
    default: ""
  - name: AGENTMAIL_API_KEY
    description: "AgentMail API key: an alternative sending inbox, if you are not using Instantly or Gmail/Outlook."
    required: false
    default: ""
  - name: ATTIO_API_KEY
    description: "Attio API key. Only if Attio is the one CRM you use and you are NOT connecting it through Composio or a connector. Any one CRM works, all are optional, and there is no default CRM. Without one, Becca uses a CSV or Google Sheet."
    required: false
    default: ""
  - name: HUBSPOT_ACCESS_TOKEN
    description: "HubSpot private-app token: only if you are NOT using Composio for HubSpot."
    required: false
    default: ""
  - name: GHL_API_KEY
    description: "GoHighLevel API key: only if you are NOT using Composio for GoHighLevel."
    required: false
    default: ""
  - name: GHL_LOCATION_ID
    description: "GoHighLevel location (sub-account) ID that Becca should write leads into."
    required: false
    default: ""
  - name: BECCA_BOOKING_LINK
    description: "Your scheduling link (Cal.com, Calendly, HubSpot Meetings). Becca drops this into emails so no calendar API is required."
    required: false
    default: ""
  - name: BECCA_APPROVAL_EMAIL
    description: "Optional pre-fill. The address where Becca emails your daily campaign for approval. Onboarding confirms it with you, and brain/config.md overrides it."
    required: false
    default: ""
  - name: BECCA_CAMPAIGN_SIZE
    description: "Optional pre-fill. Contacts in each daily campaign (default 50). Onboarding confirms it with you, and brain/config.md overrides it."
    required: false
    default: "50"
  - name: BECCA_CRM
    description: "Optional pre-fill. Which CRM you use (for example attio, hubspot, gohighlevel, pipedrive, salesforce), or blank for none. Onboarding confirms it with you, and brain/config.md overrides it."
    required: false
    default: ""
  - name: BECCA_CRM_FALLBACK
    description: "Optional pre-fill. Where Interested replies go when there is no CRM: csv or google_sheet (default csv). Onboarding confirms it with you, and brain/config.md overrides it."
    required: false
    default: "csv"
